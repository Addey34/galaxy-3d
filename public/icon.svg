<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Système solaire 3D">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b1224" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6" />
      <stop offset="45%" stop-color="#ffcf5c" />
      <stop offset="100%" stop-color="#f59a1a" />
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fb7ff" />
      <stop offset="100%" stop-color="#2b6cd6" />
    </linearGradient>
  </defs>

  <!-- Fond spatial -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Orbite inclinee -->
  <ellipse cx="256" cy="256" rx="176" ry="86" fill="none"
           stroke="#8fb4ff" stroke-opacity="0.55" stroke-width="6"
           transform="rotate(-22 256 256)" />

  <!-- Soleil central -->
  <circle cx="256" cy="256" r="78" fill="url(#sun)" />
  <circle cx="256" cy="256" r="78" fill="none" stroke="#ffe6a0" stroke-opacity="0.4" stroke-width="4" />

  <!-- Planete sur l'orbite -->
  <circle cx="404" cy="208" r="30" fill="url(#planet)" />
  <circle cx="404" cy="208" r="30" fill="none" stroke="#cfe4ff" stroke-opacity="0.5" stroke-width="3" />

  <!-- Quelques etoiles -->
  <g fill="#ffffff">
    <circle cx="86" cy="120" r="3.5" opacity="0.9" />
    <circle cx="150" cy="410" r="2.6" opacity="0.7" />
    <circle cx="430" cy="360" r="3" opacity="0.8" />
    <circle cx="360" cy="90" r="2.2" opacity="0.6" />
    <circle cx="96" cy="300" r="2.4" opacity="0.65" />
  </g>
</svg>
