name: Process remote DEM LOD

on:
  workflow_dispatch:
    inputs:
      body:
        description: Body key with a dem-linear bump entry in the manifest
        required: true
        type: string
        default: moon
      max_quality:
        description: Largest generated LOD
        required: true
        default: 4k
        type: choice
        options:
          - 2k
          - 4k
          - 8k

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install raster processing tools
        run: python -m pip install --disable-pip-version-check rasterio==1.4.4 Pillow==12.1.1 numpy==1.26.4

      - name: Process remote DEM without saving the source
        run: python scripts/process-remote-dem.py --body "${{ inputs.body }}" --max-quality "${{ inputs.max_quality }}" --apply --force

      - name: Create review branch
        shell: bash
        run: |
          set -euo pipefail
          branch="bot/dem-${{ inputs.body }}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "public/assets/textures/${{ inputs.body }}"
          if git diff --cached --quiet; then
            echo "No DEM changes detected."
            exit 0
          fi
          git commit -m "assets(texture): refresh ${{ inputs.body }} DEM bump LODs"
          git push origin "HEAD:$branch"
