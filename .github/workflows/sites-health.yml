name: Sites health

# LE GUETTEUR DES AUTRES SITES (2026-10-26).
#
# Firebase a repondu 509 sur tout le projet partage et plusieurs sites sont restes morts une semaine
# sans que personne le voie. Ils sont sur Cloudflare Pages ; ni `production-health.yml` (Galaxy) ni
# `sites-health.yml` (les gros fichiers de Galaxy) ne les regardent. Une fois par jour, ce guetteur
# rejoue `scripts/check-sites.mjs` : HTTP 200, un mot propre au site, servi par Cloudflare, CSP
# quand le site en declare une.
#
# Il ne conditionne RIEN. Meme forme que `sites-health.yml` : une issue qui RESTE, refermee par un
# passage sain. Le code 2 (« je n'ai pas pu mesurer ») ouvre l'issue comme un echec.

on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sites-health
  cancel-in-progress: false

jobs:
  probe:
    name: Do the other sites still answer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-19
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-10-23
        with:
          node-version: 22

      # Code de sortie capture SANS pipe (un pipe rend celui du dernier maillon).
      - name: Read what the sites serve
        id: verdict
        run: |
          code=0
          {
            echo '## Accueil de chaque site'
            echo '```'
            node scripts/check-sites.mjs 2>&1 || code=$?
            echo '```'
          } > sites.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          cat sites.md

      - name: Open or update the tracking issue
        if: steps.verdict.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="$(cat sites.md)"
          existing="$(gh issue list --repo "$REPO" --label sites-health --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create sites-health --repo "$REPO" \
              --description "Un des autres sites ne répond plus comme attendu" --color B60205 || true
            gh issue create --repo "$REPO" --label sites-health \
              --title "Un des autres sites ne répond plus comme attendu" --body "$body"
          fi

      - name: Close the tracking issue when the sites are healthy again
        if: steps.verdict.outputs.healthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh issue list --repo "$REPO" --label sites-health --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" --comment "$(cat sites.md)"
          fi
