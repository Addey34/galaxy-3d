name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate rapide et FIABLE : types, lint, tests unitaires, audit, build. C'est lui qui
  # conditionne le deploiement — le site se met a jour vite et n'est jamais bloque par un
  # test e2e navigateur capricieux (GPU logiciel CI).
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    # Ce gate conditionne le deploiement : un blocage ne doit jamais l'immobiliser des heures.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit:prod
      - run: pnpm build

      # Deploiement Firebase Hosting sur push main, des que verify+build passent (sans
      # attendre l'e2e). Requiert le secret FIREBASE_TOKEN.
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm dlx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}

  # Tests navigateur end-to-end : job SEPARE qui tourne en parallele. Il sert d'ALERTE
  # (un echec signale une regression de cablage) mais ne bloque pas le deploiement, car
  # le rendu WebGL en GPU logiciel CI est lent et parfois capricieux sur les scenarios lourds.
  e2e:
    name: Browser tests (e2e)
    runs-on: ubuntu-latest
    # Garde-fou : le rendu WebGL en GPU logiciel est lent et les retries CI peuvent prolonger
    # la suite ; on laisse le temps d obtenir un resultat complet plutot qu une annulation.
    # Sans ca, une install apt bloquee (miroirs Ubuntu injoignables) peut trainer des heures
    # et polluer le statut global du workflow. Le job reste non bloquant pour le deploiement.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
