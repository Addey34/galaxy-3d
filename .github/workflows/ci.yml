name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit:prod
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Déploiement Firebase Hosting UNIQUEMENT sur push vers main, une fois que tout le gate
      # ci-dessus (verify + audit + build + e2e) a passé — jamais une version cassée en ligne.
      # Requiert le secret FIREBASE_TOKEN (repo → Settings → Secrets and variables → Actions),
      # obtenu via `firebase login:ci`. Le meme jeton peut servir a plusieurs projets Firebase.
      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm dlx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
